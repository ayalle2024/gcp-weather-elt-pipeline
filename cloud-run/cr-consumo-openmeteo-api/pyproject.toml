[project]
name = "cr-consumo-openmeteo-api"
version = "0.1.0"
description = "Cloud Run service that ingests weather data from the Open-Meteo public API into raw and standardized BigQuery layers."
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "gunicorn>=21.2",
    "requests>=2.31",
    "google-cloud-storage>=2.16",
    "google-cloud-bigquery>=3.20",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
