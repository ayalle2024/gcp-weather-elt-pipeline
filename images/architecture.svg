<svg width="1220" height="1030" viewBox="0 0 1220 1030" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9z" fill="#5f6368"/>
    </marker>
    <marker id="arBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9z" fill="#1A73E8"/>
    </marker>
    <marker id="arExt" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9z" fill="#D93025"/>
    </marker>
  </defs>

  <rect width="1220" height="1030" fill="#ffffff"/>

  <!-- Title -->
  <text x="610" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#202124">GCP Weather ELT Pipeline — Architecture</text>
  <text x="610" y="58" text-anchor="middle" font-size="13" fill="#5f6368">Workflow-orchestrated ELT · Cloud Run + Cloud Storage + BigQuery (raw → std → trf) · least-privilege IAM</text>

  <!-- ===== GCP container ===== -->
  <rect x="250" y="88" width="752" height="744" rx="20" fill="#F8F9FA" stroke="#9AA0A6" stroke-width="1.2"/>
  <text x="272" y="114" font-size="14" font-weight="bold" fill="#202124">Google Cloud</text>
  <text x="372" y="114" font-size="12" fill="#5f6368">project arl-dtpr-dev-weth · us-central1 · BigQuery US</text>

  <!-- ===== External: Open-Meteo ===== -->
  <rect x="30" y="330" width="190" height="80" rx="10" fill="#FCE8E6" stroke="#D93025" stroke-width="1.3"/>
  <text x="125" y="358" text-anchor="middle" font-size="14" font-weight="bold" fill="#A50E0E">Open-Meteo API</text>
  <text x="125" y="377" text-anchor="middle" font-size="11" fill="#A50E0E">Public REST API, no key</text>
  <text x="125" y="394" text-anchor="middle" font-size="11" fill="#A50E0E">4 cities · current + 168 h</text>
  <line x1="220" y1="370" x2="278" y2="370" stroke="#D93025" stroke-width="1.6" marker-end="url(#arExt)"/>
  <text x="236" y="362" text-anchor="middle" font-size="10" font-weight="bold" fill="#A50E0E">GET</text>

  <!-- ===== Legend (left column) ===== -->
  <text x="30" y="470" font-size="12" font-weight="bold" fill="#202124">Legend</text>
  <rect x="30" y="482" width="16" height="16" rx="3" fill="#E8F0FE" stroke="#1A73E8"/>
  <text x="54" y="495" font-size="11" fill="#3c4043">Orchestration / compute</text>
  <rect x="30" y="506" width="16" height="16" rx="3" fill="#FEF7E0" stroke="#E37400"/>
  <text x="54" y="519" font-size="11" fill="#3c4043">Raw layer</text>
  <rect x="30" y="530" width="16" height="16" rx="3" fill="#E4F7F8" stroke="#12A4AF"/>
  <text x="54" y="543" font-size="11" fill="#3c4043">Standard layer</text>
  <rect x="30" y="554" width="16" height="16" rx="3" fill="#E6F4EA" stroke="#1E8E3E"/>
  <text x="54" y="567" font-size="11" fill="#3c4043">Transformed layer</text>
  <rect x="30" y="578" width="16" height="16" rx="3" fill="#FCE8E6" stroke="#D93025"/>
  <text x="54" y="591" font-size="11" fill="#3c4043">External interface</text>
  <line x1="30" y1="612" x2="46" y2="612" stroke="#1A73E8" stroke-width="1.6"/>
  <text x="54" y="616" font-size="11" fill="#3c4043">Control (trigger / poll)</text>
  <line x1="30" y1="634" x2="46" y2="634" stroke="#5f6368" stroke-width="1.6"/>
  <text x="54" y="638" font-size="11" fill="#3c4043">Data flow</text>

  <!-- Row 1: Scheduler -> Workflow -->
  <rect x="280" y="160" width="200" height="90" rx="10" fill="#E8F0FE" stroke="#1A73E8" stroke-width="1.3"/>
  <text x="380" y="186" text-anchor="middle" font-size="14" font-weight="bold" fill="#174EA6">Cloud Scheduler</text>
  <text x="380" y="205" text-anchor="middle" font-size="11" fill="#174EA6">job-trigger-weather-ingest</text>
  <text x="380" y="222" text-anchor="middle" font-size="11" fill="#174EA6">hourly · America/Lima</text>
  <text x="380" y="239" text-anchor="middle" font-size="10" font-style="italic" fill="#5f6368">created paused</text>

  <line x1="480" y1="205" x2="538" y2="205" stroke="#1A73E8" stroke-width="1.6" marker-end="url(#arBlue)"/>
  <text x="509" y="197" text-anchor="middle" font-size="10" fill="#174EA6">OAuth</text>

  <rect x="540" y="135" width="420" height="130" rx="10" fill="#E8F0FE" stroke="#1A73E8" stroke-width="1.3"/>
  <text x="560" y="160" font-size="14" font-weight="bold" fill="#174EA6">Cloud Workflows</text>
  <text x="682" y="160" font-size="11" fill="#174EA6">orquestador-weather</text>
  <text x="560" y="186" font-size="11.5" fill="#202124">1. Call Cloud Run with an OIDC token</text>
  <text x="560" y="205" font-size="11.5" fill="#202124">2. Assert body.status == "success" (not just HTTP 200)</text>
  <text x="560" y="224" font-size="11.5" fill="#202124">3. Start the scheduled query (startManualRuns)</text>
  <text x="560" y="243" font-size="11.5" fill="#202124">4. Poll every 10 s → SUCCEEDED / FAILED / CANCELLED</text>

  <!-- Workflow -> Cloud Run -->
  <path d="M600 265 L600 292 L410 292 L410 318" fill="none" stroke="#1A73E8" stroke-width="1.6" marker-end="url(#arBlue)"/>
  <text x="505" y="286" text-anchor="middle" font-size="10" fill="#174EA6">1 · POST (OIDC)</text>

  <!-- Row 2: Cloud Run -->
  <rect x="280" y="320" width="260" height="100" rx="10" fill="#E8F0FE" stroke="#1A73E8" stroke-width="1.3"/>
  <text x="410" y="346" text-anchor="middle" font-size="14" font-weight="bold" fill="#174EA6">Cloud Run (private)</text>
  <text x="410" y="365" text-anchor="middle" font-size="11" fill="#174EA6">cr-consumo-openmeteo-api</text>
  <text x="410" y="384" text-anchor="middle" font-size="11" fill="#202124">fetch → store raw → clean → validate</text>
  <text x="410" y="402" text-anchor="middle" font-size="10" font-style="italic" fill="#5f6368">Python 3.11 · Flask · 20 tests</text>

  <!-- Cloud Run -> stores (bus) -->
  <path d="M410 420 L410 445" fill="none" stroke="#5f6368" stroke-width="1.6"/>
  <path d="M380 445 L835 445" fill="none" stroke="#5f6368" stroke-width="1.6"/>
  <line x1="380" y1="445" x2="380" y2="468" stroke="#5f6368" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="605" y1="445" x2="605" y2="468" stroke="#5f6368" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="835" y1="445" x2="835" y2="468" stroke="#5f6368" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="560" y="437" font-size="10" fill="#5f6368">written before responding 200 → data is in BigQuery</text>

  <!-- Row 3: GCS / raw / std -->
  <rect x="280" y="470" width="200" height="82" rx="10" fill="#FEF7E0" stroke="#E37400" stroke-width="1.3"/>
  <text x="380" y="494" text-anchor="middle" font-size="13" font-weight="bold" fill="#7A4100">Cloud Storage · raw</text>
  <text x="380" y="513" text-anchor="middle" font-size="10.5" fill="#7A4100">weather_current/in/&lt;date&gt;/</text>
  <text x="380" y="530" text-anchor="middle" font-size="10.5" fill="#7A4100">untouched JSON per city</text>
  <text x="380" y="545" text-anchor="middle" font-size="10" font-style="italic" fill="#5f6368">replay without re-calling API</text>

  <rect x="500" y="470" width="210" height="82" rx="10" fill="#FEF7E0" stroke="#E37400" stroke-width="1.3"/>
  <text x="605" y="494" text-anchor="middle" font-size="13" font-weight="bold" fill="#7A4100">BigQuery · raw</text>
  <text x="605" y="513" text-anchor="middle" font-size="10.5" fill="#7A4100">raw_arl_pe_openmeteo</text>
  <text x="605" y="530" text-anchor="middle" font-size="10.5" fill="#7A4100">.current_weather</text>
  <text x="605" y="545" text-anchor="middle" font-size="10" font-style="italic" fill="#5f6368">source mirror · partitioned</text>

  <rect x="730" y="470" width="210" height="82" rx="10" fill="#E4F7F8" stroke="#12A4AF" stroke-width="1.3"/>
  <text x="835" y="494" text-anchor="middle" font-size="13" font-weight="bold" fill="#0B5C63">BigQuery · std</text>
  <text x="835" y="513" text-anchor="middle" font-size="10.5" fill="#0B5C63">std_arl_pe_openmeteo</text>
  <text x="835" y="530" text-anchor="middle" font-size="10.5" fill="#0B5C63">.trx_weather_reading</text>
  <text x="835" y="545" text-anchor="middle" font-size="10" font-style="italic" fill="#5f6368">validated · standard names</text>

  <!-- raw/std -> Scheduled Query -->
  <line x1="605" y1="552" x2="605" y2="598" stroke="#5f6368" stroke-width="1.6" marker-end="url(#ar)"/>
  <path d="M835 552 L835 575 L720 575 L720 598" fill="none" stroke="#5f6368" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- Workflow -> Scheduled Query (control lane on the right) -->
  <path d="M960 200 L982 200 L982 640 L762 640" fill="none" stroke="#1A73E8" stroke-width="1.6" marker-end="url(#arBlue)"/>
  <text x="872" y="632" text-anchor="middle" font-size="10" fill="#174EA6">3 · start run · 4 · poll</text>

  <!-- Row 4: Scheduled Query -->
  <rect x="500" y="600" width="260" height="82" rx="10" fill="#E8F0FE" stroke="#1A73E8" stroke-width="1.3"/>
  <text x="630" y="624" text-anchor="middle" font-size="13" font-weight="bold" fill="#174EA6">BigQuery Scheduled Query</text>
  <text x="630" y="643" text-anchor="middle" font-size="10.5" fill="#174EA6">sq_transform_weather_standard_to_trf</text>
  <text x="630" y="660" text-anchor="middle" font-size="10.5" fill="#202124">on-demand · 2 × MERGE</text>
  <text x="630" y="675" text-anchor="middle" font-size="10" font-style="italic" fill="#5f6368">idempotent, safe to re-run</text>

  <!-- SQ -> outputs (bus) -->
  <path d="M630 682 L630 705" fill="none" stroke="#5f6368" stroke-width="1.6"/>
  <path d="M530 705 L785 705" fill="none" stroke="#5f6368" stroke-width="1.6"/>
  <line x1="530" y1="705" x2="530" y2="728" stroke="#5f6368" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="785" y1="705" x2="785" y2="728" stroke="#5f6368" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="657" y="722" text-anchor="middle" font-size="10" fill="#5f6368">MERGE … WHEN NOT MATCHED</text>

  <!-- Row 5: master + curated fact -->
  <rect x="420" y="730" width="220" height="82" rx="10" fill="#E4F7F8" stroke="#12A4AF" stroke-width="1.3"/>
  <text x="530" y="754" text-anchor="middle" font-size="13" font-weight="bold" fill="#0B5C63">BigQuery · std (master)</text>
  <text x="530" y="773" text-anchor="middle" font-size="10.5" fill="#0B5C63">std_arl_pe_openmeteo</text>
  <text x="530" y="790" text-anchor="middle" font-size="10.5" fill="#0B5C63">.ori_mtr_location</text>
  <text x="530" y="805" text-anchor="middle" font-size="10" font-style="italic" fill="#5f6368">city master · self-populating</text>

  <rect x="670" y="730" width="230" height="82" rx="10" fill="#E6F4EA" stroke="#1E8E3E" stroke-width="1.3"/>
  <text x="785" y="754" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D5323">BigQuery · trf (curated)</text>
  <text x="785" y="773" text-anchor="middle" font-size="10.5" fill="#0D5323">trf_weather</text>
  <text x="785" y="790" text-anchor="middle" font-size="10.5" fill="#0D5323">.trf_weather_hourly</text>
  <text x="785" y="805" text-anchor="middle" font-size="10" font-style="italic" fill="#5f6368">hourly fact · partitioned by day</text>

  <!-- ===== External: BI consumption ===== -->
  <line x1="900" y1="771" x2="1028" y2="771" stroke="#D93025" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arExt)"/>
  <rect x="1030" y="731" width="170" height="80" rx="10" fill="#FCE8E6" stroke="#D93025" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text x="1115" y="760" text-anchor="middle" font-size="14" font-weight="bold" fill="#A50E0E">Looker Studio</text>
  <text x="1115" y="779" text-anchor="middle" font-size="11" fill="#A50E0E">BI consumption</text>
  <text x="1115" y="796" text-anchor="middle" font-size="10" font-style="italic" fill="#A50E0E">optional</text>

  <!-- ===== IAM band ===== -->
  <text x="30" y="870" font-size="14" font-weight="bold" fill="#202124">Runtime identities</text>
  <text x="170" y="870" font-size="12" fill="#5f6368">one service account per component · least privilege · no default service account in use</text>

  <g font-size="10.5">
    <rect x="30" y="884" width="222" height="84" rx="8" fill="#ffffff" stroke="#9AA0A6"/>
    <text x="42" y="904" font-size="12" font-weight="bold" fill="#202124">Cloud Scheduler</text>
    <text x="42" y="922" fill="#174EA6">sa-weather-scheduler-invoker</text>
    <text x="42" y="940" fill="#3c4043">workflows.invoker</text>

    <rect x="264" y="884" width="222" height="84" rx="8" fill="#ffffff" stroke="#9AA0A6"/>
    <text x="276" y="904" font-size="12" font-weight="bold" fill="#202124">Cloud Workflows</text>
    <text x="276" y="922" fill="#174EA6">sa-weather-workflow-runtime</text>
    <text x="276" y="940" fill="#3c4043">run.invoker (this service only)</text>
    <text x="276" y="956" fill="#3c4043">custom role weatherTransferRunner</text>

    <rect x="498" y="884" width="222" height="84" rx="8" fill="#ffffff" stroke="#9AA0A6"/>
    <text x="510" y="904" font-size="12" font-weight="bold" fill="#202124">Cloud Run</text>
    <text x="510" y="922" fill="#174EA6">sa-weather-cloudrun-runtime</text>
    <text x="510" y="940" fill="#3c4043">storage.objectCreator (bucket)</text>
    <text x="510" y="956" fill="#3c4043">bigquery.dataEditor (raw, std)</text>

    <rect x="732" y="884" width="222" height="84" rx="8" fill="#ffffff" stroke="#9AA0A6"/>
    <text x="744" y="904" font-size="12" font-weight="bold" fill="#202124">Scheduled Query</text>
    <text x="744" y="922" fill="#174EA6">sa-weather-sq-runtime</text>
    <text x="744" y="940" fill="#3c4043">bigquery.jobUser</text>
    <text x="744" y="956" fill="#3c4043">dataset-scoped read / write</text>

    <rect x="966" y="884" width="222" height="84" rx="8" fill="#ffffff" stroke="#9AA0A6"/>
    <text x="978" y="904" font-size="12" font-weight="bold" fill="#202124">Cloud Build (deploy)</text>
    <text x="978" y="922" fill="#174EA6">sa-weather-cloudbuild</text>
    <text x="978" y="940" fill="#3c4043">run.builder</text>
  </g>

  <text x="610" y="1008" text-anchor="middle" font-size="12" fill="#5f6368">≈ 676 rows per run · $0/month on the GCP free tier · Cloud Run scales to zero · all config via environment variables</text>
</svg>
