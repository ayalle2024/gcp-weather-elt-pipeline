# Environment Variables del Workflow orquestador-weather.
# El YAML del Workflow las lee con sys.get_env("clave"); no hay nada hardcodeado
# en orquestador-weather.yaml.
#
# Se cargan en la sección "Environment variables" de la consola al crear/editar
# el Workflow, o con:
#   gcloud workflows deploy orquestador-weather --location=us-central1 \
#     --source=orquestador-weather.yaml --env-vars-file=env.yaml \
#     --service-account=sa-weather-workflow-runtime@<PROJECT_ID>.iam.gserviceaccount.com
#
# Reemplazar los <PLACEHOLDERS> con los valores del proyecto:
#   project_number     -> gcloud projects describe <PROJECT_ID> --format="value(projectNumber)"
#   transfer_config_id -> bq ls --transfer_config --transfer_location=us --project_id=<PROJECT_ID>
project_id: "arl-dtpr-dev-weth"
project_number: "<PROJECT_NUMBER>"
region: "us-central1"
transfer_location: "us"
cloud_run_service_name: "cr-consumo-openmeteo-api"
transfer_config_id: "<TRANSFER_CONFIG_ID>"
poll_interval_seconds: "10"
